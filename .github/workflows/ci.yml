name: CI Pipeline

on:
  push:
    branches:
      - 'SCRUM-**'
      - 'scrum-**'
  pull_request:
    branches:
      - develop

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          ini-values: post_max_size=256M, upload_max_filesize=256M
          coverage: none

      # Move into the backend directory and install Composer dependencies
      - name: Install Composer Dependencies
        working-directory: be
        run: |
          composer install --prefer-dist --no-progress --no-suggest

      # Run backend tests via PHPUnit
      - name: Run PHPUnit Tests
        working-directory: be
        run: |
          php vendor/bin/phpunit

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Node.js for npm
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Install dependencies and build the frontend
      - name: Install Dependencies & Build Frontend
        working-directory: fe
        run: |
          npm ci
          npm run build
      # This dependancy doesn't import, for whatever reason TODO: fix    
      - name: Install jsdom Dependency
        working-directory: fe
        run: npm install --save-dev jsdom
              
      # Run frontend tests
      - name: Run Frontend Tests
        working-directory: fe
        run: npx vitest run